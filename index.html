<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu de Navegação -->
    <nav>
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Catálogo</a>
        <a href="#" class="nav-link">Sobre</a>
    </nav>

    <!-- Título Principal -->
    <header class="main-header">
        <h1>Biblioteca Virtual</h1>

    <main class="content-container">

                <p>Autor do Livro 1</p>

            <!-- Livro 2 -->

                <div class="book-cover-placeholder">📖</div>

            </div>

            <!-- Livro 3 -->

                <div class="book-cover-placeholder">📖</div>

                <p>Autor do Livro 3</p>
                <a href="#" class="btn-detalhes">Ver Detalhes</a>
            </div>

        </div>

    <!-- Botão Flutuante da IA -->
    <a href="chat.html" class="chat-toggle-button">💬 Perguntar à IA</a>
