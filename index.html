<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- <script src="https://jsdelivr.net"></script> -->
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
</head>
<body>
     background-image: url('https://i.pinimg.com/736x/9d/f0/d7/9df0d7ed1265ec8ad1a63e70ac1a822f.jpg');
    <nav>
        <p>Home</p>
        <p>Detalhes</p>
        <p>Titulo</p>
    </nav>
    <p id="texto-post">biblioteca</p>

    <form id="meu-form">
        <div>
            <label for="email">Digite seu email</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label for="message">Mande uma mensagem:</label>
            <textarea id="message" required></textarea>
        </div>
        <button type="submit">Send</button>
    </form>

    <!-- Elemento necessário para exibir a resposta da IA -->
    <div id="texto-post"></div>

    <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('Colocar link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
</body>
</html>
