<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
     <nav>
        <p>Home</p>

    <!-- modify this form HTML and place wherever you want your form

  <form id="meu-form">
        <div>
          <label for="email">Digite seu email</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label for="message">Mande uma message:</label>
          <textarea id="message" required></textarea>
        </div>
        </label>
        <button type="submit">Send</button>
      </form>
  <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('https://larissa-narok.app.n8n.cloud/webhook-test/40c0d64e-f4fe-477e-831d-5fddf4b28473', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
</body>
</html>
