
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat com a IA - Biblioteca Virtual</title>

    <!-- Biblioteca para interpretar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page-body">

    <div class="chat-page-container">

        <header class="chat-header">
            <h2>🤖 Assistente Literário IA</h2>

            <a href="index.html" class="chat-back-button">
                ⬅ Voltar
            </a>
        </header>

        <p class="chat-introducao">
            Faça perguntas sobre livros, autores ou peça recomendações de leitura.
        </p>

        <form id="meu-form">

            <div>
                <label for="email">Seu e-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemplo@email.com"
                    required
                >
            </div>

            <div>
                <label for="message">Sua pergunta</label>

                <textarea
                    id="message"
                    placeholder="Ex.: Me indique um livro de suspense."
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn-enviar">
                Perguntar
            </button>

        </form>

        <div id="texto-post" class="chat-resposta">

            <p>
                A IA está pronta para responder suas perguntas.
            </p>

        </div>

    </div>

    <script>

        const form = document.getElementById("meu-form");
        const resposta = document.getElementById("texto-post");

        form.addEventListener("submit", async (e) => {

            e.preventDefault();

            resposta.innerHTML =
                "<p><strong>🤖 Pensando...</strong><br>Aguarde alguns segundos.</p>";

            try {

                const response = await fetch(
                    "https://larissa-narok.app.n8n.cloud/webhook/40c0d64e-f4fe-477e-831d-5fddf4b28473",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            email: document.getElementById("email").value,

                            message: document.getElementById("message").value

                        })

                    }
                );

                if (!response.ok) {
                    throw new Error(`Erro HTTP ${response.status}`);
                }

                const text = await response.text();

                if (!text.trim()) {

                    resposta.innerHTML =
                        "<p>A IA não retornou nenhuma resposta.</p>";

                    return;

                }

                resposta.innerHTML = marked.parse(text);

            } catch (erro) {

                console.error(erro);

                resposta.innerHTML = `
                    <p style="color:red;">
                        ❌ Não foi possível conectar ao assistente.
                    </p>
                    <p>
                        Verifique se o workflow do n8n está ativo
                        e se o webhook está correto.
                    </p>
                `;

            }

        });

    </script>

</body>

</html>
